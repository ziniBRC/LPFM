model:
  swinir:
    target: diffbir.model.swinir.SwinIR
    params:
      img_size: 64
      patch_size: 1
      in_chans: 3
      embed_dim: 180
      depths: [6, 6, 6, 6, 6, 6, 6, 6]
      num_heads: [6, 6, 6, 6, 6, 6, 6, 6]
      window_size: 8
      mlp_ratio: 2
      sf: 8
      img_range: 1.0
      upsampler: "nearest+conv"
      resi_connection: "1conv"
      unshuffle: True
      unshuffle_scale: 8
dataset:
  train: 
    target: diffbir.dataset.virtual_staining_he2pas_uniform.CodeformerDataset
    params:
      # training file list path
      file_list: /mnt/data/ziyiliu/virtual_staining/he2pas_uniform/
      mode: train
      stage: 2
      file_backend_cfg:
        target: diffbir.dataset.file_backend.HardDiskBackend
      out_size: 256
      crop_type: center
      blur_kernel_size: 41
      kernel_list: ['iso', 'aniso']
      kernel_prob: [0.5, 0.5]
      blur_sigma: [0.1, 12]
      downsample_range: [1, 12]
      noise_range: [0, 15]
      jpeg_range: [30, 100]
  val: 
    target: diffbir.dataset.virtual_staining_he2pas_uniform.CodeformerDataset
    params:
      # training file list path
      file_list: /mnt/data/ziyiliu/virtual_staining/he2pas_uniform/
      mode: test
      stage: 2
      file_backend_cfg:
        target: diffbir.dataset.file_backend.HardDiskBackend
      out_size: 256
      crop_type: center
      blur_kernel_size: 41
      kernel_list: ['iso', 'aniso']
      kernel_prob: [0.5, 0.5]
      blur_sigma: [0.1, 12]
      downsample_range: [1, 12]
      noise_range: [0, 15]
      jpeg_range: [30, 100]

batch_transform:
  target: diffbir.dataset.batch_transform.IdentityBatchTransform

train:
  # experiment directory path
  exp_dir: /mnt/data/ziyiliu/logs/diffbir/stage1_he2pas_uniform/
  learning_rate: 1e-4
  # total batch size
  batch_size: 8
  num_workers: 8
  train_steps: 150000
  log_every: 50
  ckpt_every: 10000
  image_every: 1000
  val_every: 1000
  resume: /mnt/data/ziyiliu/logs/diffbir/stage1_he2pas_uniform/checkpoints/0050000.pt

